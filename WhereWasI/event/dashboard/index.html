<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where was I? — Dashboard</title>
    <meta name="apple-itunes-app" content="app-id=6758056060, app-argument=https://masawata.net/WhereWasI/event/dashboard">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container { max-width: 400px; }
        .icon {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            margin: 0 auto 24px;
            overflow: hidden;
        }
        .icon img { width: 100%; height: 100%; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 16px; color: #999; margin-bottom: 32px; line-height: 1.5; }
        .btn {
            display: inline-block;
            background: #0A84FF;
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .secondary {
            display: block;
            margin-top: 16px;
            color: #0A84FF;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <img src="/WhereWasI/images/WhereWasI.png" alt="Where was I? app icon">
        </div>
        <h1>Your World in Hexagons</h1>
        <p>Explore your recorded visits and photo check-ins on the Dashboard in Where was I? If you don’t have the app yet, download it from the App Store.</p>
        <a href="https://apps.apple.com/app/apple-store/id6758056060?pt=127843312&ct=HEXAGON_MAP_EVENT&mt=8" class="btn">
            Download on the App Store
        </a>
        <a href="/WhereWasI/" class="secondary">Learn more about Where was I?</a>
    </div>
</body>
</html>
