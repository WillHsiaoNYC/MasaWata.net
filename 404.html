<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Not found — redirecting…</title>

    <!-- JavaScript redirect based on path -->
    <script>
        (function () {
            var path = window.location.pathname;
            var target;
            if (path.indexOf("/WhereWasI") === 0) {
                target = "https://masawata.net/WhereWasI/";
            } else if (path.indexOf("/TimerOnMe") === 0 || path.indexOf("/TimeOnMe") === 0) {
                target = "https://masawata.net/TimerOnMe/";
            } else if (path.indexOf("/SoccerTimeTrack") === 0 || path.indexOf("/SoccerMinutes") === 0) {
                target = "https://masawata.net/SoccerTimeTrack/";
            } else if (path.indexOf("/IceTimeTrack") === 0) {
                target = "https://masawata.net/IceTimeTrack/";
            } else if (path.indexOf("/TallyCounter123") === 0) {
                target = "https://masawata.net/TallyCounter123/";
            } else if (path.indexOf("/CarPlateScan") === 0) {
                target = "https://masawata.net/CarPlateScan/";
            } else if (path.indexOf("/FitnessStory") === 0) {
                target = "https://masawata.net/FitnessStory/";
            } else {
                target = "https://masawata.net/";
            }
            try { window.location.replace(target); }
            catch (e) { window.location.href = target; }
        })();
    </script>

    <!-- Fallback: meta-refresh to FitnessStory (only fires if JS is disabled) -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://masawata.net/FitnessStory/" />
    </noscript>
</head>

<body>
    <noscript>
        <p>Page not found. <a href="https://masawata.net/FitnessStory/">Go to Fitness Story</a> or <a href="https://masawata.net/WhereWasI/">Go to Where Was I</a>.</p>
    </noscript>
</body>

</html>
