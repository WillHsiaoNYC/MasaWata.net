<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Not found — redirecting…</title>

    <!-- JavaScript redirect based on path -->
    <script>
        (function () {
            var path = window.location.pathname;
            var target;
            if (path.indexOf("/WhereWasI/") === 0) {
                target = "https://masawata.net/WhereWasI/";
            } else {
                target = "https://masawata.net/FitnessStory/";
            }
            try { window.location.replace(target); }
            catch (e) { window.location.href = target; }
        })();
    </script>

    <!-- Fallback: meta-refresh to FitnessStory (only fires if JS is disabled) -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://masawata.net/FitnessStory/" />
    </noscript>
</head>

<body>
    <noscript>
        <p>Page not found. <a href="https://masawata.net/FitnessStory/">Go to Fitness Story</a> or <a href="https://masawata.net/WhereWasI/">Go to Where Was I</a>.</p>
    </noscript>
</body>

</html>
